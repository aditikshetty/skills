<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="account-menu">
        <button
          id="account-button"
          class="account-button"
          type="button"
          aria-label="Teacher account"
          aria-expanded="false"
          aria-controls="account-panel"
        >
          <span aria-hidden="true">👤</span>
        </button>
        <div id="account-panel" class="account-panel hidden">
          <p id="account-status">Viewing as a guest</p>
          <button id="login-open" type="button">Teacher log in</button>
          <button id="logout-button" class="secondary-button hidden" type="button">
            Log out
          </button>
        </div>
      </div>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <dialog id="login-dialog" aria-labelledby="login-title">
      <form id="login-form">
        <h3 id="login-title">Teacher log in</h3>
        <div class="form-group">
          <label for="teacher-username">Username:</label>
          <input id="teacher-username" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="teacher-password">Password:</label>
          <input
            id="teacher-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <p id="login-message" class="login-message hidden" role="alert"></p>
        <div class="dialog-actions">
          <button type="submit">Log in</button>
          <button id="login-cancel" class="secondary-button" type="button">Cancel</button>
        </div>
      </form>
    </dialog>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form" class="hidden">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <p id="teacher-login-prompt">
          Teacher login is required to register or unregister students.
        </p>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
